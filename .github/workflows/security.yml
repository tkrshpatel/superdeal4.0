name: Security and production proxy
on:
  push:
    branches: [main, 'phase-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python checks
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' pip-audit
      - name: Python advisory audit
        run: pip-audit
      - name: Frontend advisory audit and production build
        working-directory: app
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
      - name: Install checksum-verified security tools
        run: |
          mkdir -p /tmp/security-tools
          cd /tmp/security-tools
          curl --fail --location --retry 3 -O https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz
          curl --fail --location --retry 3 -O https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_checksums.txt
          grep ' caddy_2.11.7_linux_amd64.tar.gz$' caddy_2.11.7_checksums.txt | sha512sum --check
          tar -xzf caddy_2.11.7_linux_amd64.tar.gz caddy
          curl --fail --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Tracked history secret scan
        run: /tmp/security-tools/gitleaks git --redact=100 --log-opts='--all'
      - name: Exercise real Caddy routing, alerts and security boundaries
        env:
          CADDY_BINARY: /tmp/security-tools/caddy
        run: python -m pytest tests/test_hosting_security.py superdeal_phase2_full/test_http_security.py -ra
