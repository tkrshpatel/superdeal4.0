name: Windows desktop launcher
on:
  push:
    branches: [main, 'phase-*']
    paths: ['scripts/*pipeline*', 'scripts/Start-SuperDeals.bat', 'tests/test_windows_pipeline_launcher.py', 'tests/test_scheduled_notifications.py', 'superdeal_phase2_full/notification_worker.py', 'superdeal_phase2_full/notifications.py', '.github/workflows/windows-launcher.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/*pipeline*', 'scripts/Start-SuperDeals.bat', 'tests/test_windows_pipeline_launcher.py', 'tests/test_scheduled_notifications.py', 'superdeal_phase2_full/notification_worker.py', 'superdeal_phase2_full/notifications.py', '.github/workflows/windows-launcher.yml']
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pymongo mongomock python-dotenv requests certifi
      - name: Parse scripts with Windows PowerShell
        shell: powershell
        run: |
          foreach ($path in @('scripts/start_pipeline.ps1','scripts/pipeline_service.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Credential isolation and real Windows mutex tests
        run: python -m pytest tests/test_windows_pipeline_launcher.py tests/test_scheduled_notifications.py tests/test_notification_intake.py -q
