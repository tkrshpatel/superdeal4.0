name: Android App

permissions:
  contents: read

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install web dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Generate Android project if missing
        run: if [ ! -d android ]; then npx cap add android; fi
      - name: Sync web assets
        run: npx cap sync android
      - name: Test web app
        run: npm test
      - name: Build debug APK
        working-directory: app/android
        run: bash ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: superdeal-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test dynamic system-bar spacing on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "${{ github.workspace }}/app/android/gradlew" -p "${{ github.workspace }}/app/android" connectedDebugAndroidTest
      - name: Build unsigned release bundle for validation
        working-directory: app/android
        run: bash ./gradlew bundleRelease
      - name: Upload unsigned release bundle (sign before Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: superdeals-UNSIGNED-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
